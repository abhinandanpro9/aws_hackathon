name = "awshk-frontdesk-api"
account_id = "28a249f75ae53650fe079530952d8227"
main = "src/worker.ts"
compatibility_date = "2026-04-27"
compatibility_flags = ["nodejs_compat"]

# The 45 policies and the structured facts ship as a bundled JSON import, so a cold start
# has the centre's data without a network call. Only mutable state lives in D1.
[[d1_databases]]
binding = "DB"
database_name = "awshk_frontdesk_state"
database_id = "5b8e8c39-f17a-4151-bd6d-04c6e28a0869"

[vars]
GEMINI_MODELS = "gemini-3.5-flash-lite,gemini-3.7-flash,gemini-3.5-flash,gemini-2.5-flash,gemini-3.6-flash"
SPONSOR_PRELINT = "REAL"
SPONSOR_ROCKETRIDE = "FALLBACK"
SPONSOR_MASKY = "REAL"
N8N_WEBHOOK_URL = "https://awshackathon.app.n8n.cloud/webhook/frontdesk-escalation"
# GEMINI_API_KEY is set per-environment, never committed. See README.
